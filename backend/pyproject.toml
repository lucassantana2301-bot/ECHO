[project]
name = "echo-backend"
version = "0.1.0"
description = "ECHO — Your Digital Twin: memory backend (episodes, claims, evidence, bitemporal retrieval)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.142",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pgvector>=0.3.6",
  "pyjwt>=2.9",
  "argon2-cffi>=23.1",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/echo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["db: requires a reachable PostgreSQL+pgvector test database"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]
